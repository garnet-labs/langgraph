name: baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "libs/**"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/langgraph
    steps:
      - uses: actions/checkout@v6
      - name: Garnet Runtime Review
        uses: garnet-org/action@245ad6be82de3200c205109c8ca7ac816dc692ea # v2.3.0
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
      - run: SHA=$(git rev-parse HEAD) && echo "SHA=$SHA" >> $GITHUB_ENV
      - name: Set up Python 3.11
        uses: ./.github/actions/uv_setup
        with:
          python-version: "3.11"
          cache-suffix: "bench"
          working-directory: libs/langgraph
      - name: Install dependencies
        run: uv sync --group test
      - name: Run benchmarks
        run: OUTPUT=out/benchmark-baseline.json make -s benchmark
      - name: Save outputs
        uses: actions/cache/save@v5
        with:
          key: ${{ runner.os }}-benchmark-baseline-${{ env.SHA }}
          path: |
            libs/langgraph/out/benchmark-baseline.json
